# Entrees pour General_CartoSynthese_obs.py
# Fichier de configuration pour des assemblages de cartes 
# montrant le climat observé à l'aide réanalyses et de 
# donnees homogénéisées aux station.
#
# Panneaux de figures correspondennt aux figures finales (mars 2026)
# de la Synthèse d'Ouranos sur l'évolution des températures au Québec.
#
#------------------------------------------
# Section commune a tous les panneaux

climdatadir: "/exec/cote/data/temperatures_obsflow2/climatology" # Dossier des donnees climadata
#climdatadir: "/exec/cote/data/indic_obsflow/climatology" # Dossier des donnees 
outfolder: "/exec/cote/obsflow/REFONTE2" # Dossier de sortie pour les figures
add_contour_lab: False
add_contours: False

season_dict: &seasonal_alias
  seasonal:
    DJF: "Hiver"
    MAM: "Printemps"
    JJA: "Été"
    SON: "Automne"
  annual: &annual_alias
    annual: "Annuel"

noms_variables_dict: &variables_alias
  tn: "Tmin"
  tg: "Tmoy"
  tx: "Tmax"
  dtr: "AQT"  

#-------------------------------------------
# Definition de chacun des panneaux de cartes
# ------------------------------------------

panno_dict:
  panno1:     ### Figure 2 normales sausonnières Tmin, Tmoy, Tmax 1991-2020 
    agencement: 'trio_saisonnier'
    horizon: "1991-2020"
    affiche_IDM: True
    recon: "GovCan_CaSR"
    affiche_stations: True
    stationsprefix: "GovCan_AHCCD_CAN_station-tas"
    tendances: False
    absvalues: True
    figsize: [7.5, 10]
    seasons: &seasons1 ['DJF', 'MAM', 'JJA', 'SON']
    xfreq: "QS-DEC"
    variables: &variables1 ['tn_mean_clim_mean', 'tg_mean_clim_mean', 'tx_mean_clim_mean']
    carto_options:
      draw_gridlines: True
      cmap: "temp_div"
      divergent: True
      asymmetric: False
      colorlim: [-30, 30]
      c_interv: 3.0
      edgecolor: "#6F6F6F"
      extend: "both"
      suptitle: "normales saisonnières"
      titles_variables:
        tn_mean_clim_mean: "Tmin"
        tg_mean_clim_mean: "Tmoy"
        tx_mean_clim_mean: "Tmax"
      titles_saisons: *seasonal_alias
      

    
  panno2:     ### Figure A1 normales annuelles Tmin, Tmoy, Tmax 1991-2020
    agencement: 'trio_annuel'
